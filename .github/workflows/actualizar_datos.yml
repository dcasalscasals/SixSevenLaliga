name: Actualizar datos de Padel

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 8:00 AM automáticamente
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras con un botón

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar cambios en GitHub
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Actualización automática de resultados de la federación"
          branch: main
